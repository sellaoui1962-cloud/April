name: Build April APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Works with the project files uploaded as they are, or with the project .zip
      # uploaded anywhere near the repository root (the archive is unzipped here).
      - name: Locate project
        id: project
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            dir="."
          else
            zip_file=$(find . -maxdepth 2 -name '*.zip' -not -path './_project/*' | head -n 1)
            if [ -z "$zip_file" ]; then
              echo "::error::No Gradle project found. Upload the project files, or upload the project .zip to the repository."
              exit 1
            fi
            mkdir -p _project
            unzip -q -o "$zip_file" -d _project
            settings=$(find _project -maxdepth 3 -name 'settings.gradle*' | head -n 1)
            if [ -z "$settings" ]; then
              echo "::error::The zip does not contain settings.gradle.kts"
              exit 1
            fi
            dir=$(dirname "$settings")
          fi
          echo "Project directory: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The project ships without gradlew (it needs a binary jar), so the workflow installs Gradle itself.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: April-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
